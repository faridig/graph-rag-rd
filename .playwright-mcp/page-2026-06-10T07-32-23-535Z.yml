          - list [ref=e132]:
            - listitem [ref=e133]: "SME, pressions, couple et température matière : L'augmentation du taux d'huile diminue la SME, les pressions, le couple et la température matière (avec une stabilisation de la SME et du couple à 14% d'huile) [source: ACE-5:Run:1]."
