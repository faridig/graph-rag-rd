            - listitem [ref=e135]: "Absorption en eau : L'absorption diminue avec l'huile lorsqu'on utilise du gluten Roquette, mais pas avec le gluten ADM (à 14% d'huile, l'absorption n'est plus que de -7.9% contre -33.2% avec le gluten Roquette). La note indique un doute sur la cause : changement de gluten ou mise sous vide [source: ACE-5:Run:1]."
            - listitem [ref=e136]: "Fermeté et forces de coupe : La fermeté (hardness) et les forces de coupe (cut_T) baissent progressivement avec l'augmentation du taux d'huile [source: ACE-5:Run:1]."
            - listitem [ref=e137]: "Anisotropie : L'anisotropie reste stable autour de -1 (les variations sont comprises entre -2.5% et -26.6%) [source: ACE-5:Run:1]."
