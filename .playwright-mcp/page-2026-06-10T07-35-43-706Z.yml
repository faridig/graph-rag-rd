            - article [ref=e131]: "[source: ACE-5:Run:1]"
            - heading "Synthèse des tendances" [level=3] [ref=e132]
            - list [ref=e133]:
              - listitem [ref=e134]: "Process : L'augmentation du taux d'huile diminue la SME, les pressions, le couple et la température matière (avec une stabilisation SME/couple à 14%). L'effet de pompage s'intensifie et l'huile exsude sous vide [source: ACE-5:Run:1]."
              - listitem [ref=e135]: "Texture : La fermeté (hardness) et les forces de coupe (cut_T) baissent progressivement avec l'augmentation du taux d'huile. L'anisotropie reste globalement stable autour de -1 (aucune tendance claire à la baisse ou à la hausse) [source: ACE-5:Run:1]."
              - listitem [ref=e136]: "Absorption : L'absorption en eau diminue avec l'huile lorsqu'on utilise le gluten Roquette, mais pas avec le gluten ADM (à 14% d'huile, l'absorption n'est qu'à -7.9% contre -33.2% avec le gluten Roquette). La synthèse note une incertitude : \"est-ce le changement de gluten ou la mise sous vide qui a modifié l'absorption ?\" [source: ACE-5:Run:1]."
            - heading "Limites" [level=3] [ref=e137]
            - list [ref=e138]:
              - listitem [ref=e139]: "Fiabilité des données : Le fichier note que les réplicats de coupe ne sont pas fiables pour la référence sans huile (essai 1), car un problème d'étiquetage a eu lieu. Les agrégats de la \"Fiche de résultats\" sont considérés comme faisant foi [source: ACE-5:Run:1]."
