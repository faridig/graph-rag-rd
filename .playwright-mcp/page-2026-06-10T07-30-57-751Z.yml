        - generic [ref=e66]:
          - article [ref=e67]: "D'après le contexte fourni, l'effet de l'huile sur la recette M03 (20/80) a été étudié dans l'essai ACE-5 [source: ACE-5:Run:1]."
          - article [ref=e68]: "Voici les effets observés, basés sur les valeurs dérivées et calculées par rapport à la référence \"Ref M03 sans huile\" :"
          - list [ref=e69]:
            - listitem [ref=e70]: "SME, pressions et couple : L'augmentation du taux d'huile diminue la SME, les pressions et le couple. On observe une stabilisation de la SME et du couple à 14% d'huile [source: ACE-5:Run:1]."
            - listitem [ref=e71]: "Température matière : L'augmentation du taux d'huile diminue la température matière [source: ACE-5:Run:1]."
            - listitem [ref=e72]: "Procédé : L'effet de pompage s'intensifie avec l'augmentation du taux d'huile. De plus, l'huile exsude sous vide [source: ACE-5:Run:1]."
            - listitem [ref=e73]: "Absorption en eau : L'absorption diminue avec l'huile lorsque le gluten Roquette est utilisé, mais pas avec le gluten ADM. La synthèse note une interrogation : \"est-ce le changement de gluten ou la mise sous vide qui à modifier l'absorption ?\" [source: ACE-5:Run:1]."
            - listitem [ref=e74]: "Fermeté et forces de coupe : La fermeté (hardness) et les forces de coupe (cut_T) baissent progressivement avec l'augmentation du taux d'huile [source: ACE-5:Run:1]."
            - listitem [ref=e75]: "Anisotropie : L'anisotropie reste stable, autour de ~1 [source: ACE-5:Run:1]."
          - article [ref=e76]: "Les valeurs numériques détaillées pour chaque taux d'huile sont les suivantes [source: ACE-5:Run:1] :"
