name: CI

on:
  push:
  pull_request:

jobs:
  # ── Garde-fou correctness : bloquant ────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      # Variables factices : config.py lit ces clés À L'IMPORT (os.environ[...]),
      # donc sans elles la simple collecte des tests planterait (KeyError).
      # Les clients réseau (Neo4j/OpenAI/Anthropic) sont mockés dans les tests —
      # ces valeurs ne servent jamais à un appel réel.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: dummy
      OPENAI_API_KEY: dummy
      ANTHROPIC_API_KEY: dummy
      # Le monitoring n'écrit rien en CI (les tests query_log redirigent le
      # fichier vers tmp_path ; les autres tests ne le touchent pas).
      QUERY_LOG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # ── Lint : indicatif (n'échoue jamais la CI, rapport visible) ────────────────
  # Dette ruff préexistante (~40 E501, imports, etc.) à nettoyer progressivement.
  # Passer ce job en bloquant une fois la dette résorbée (retirer continue-on-error).
  lint:
    name: Lint (ruff) — indicatif
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/
